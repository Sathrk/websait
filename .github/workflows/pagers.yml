
name: Deploy Minecraft Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website and extract images
        run: |
          mkdir -p _site
          rsync -av --exclude='.git' --exclude='.github' --exclude='_site' --exclude='items.zip' ./ _site/

          mkdir -p /tmp/items-extracted
          unzip -oq items.zip -d /tmp/items-extracted

          mkdir -p _site/items
          find /tmp/items-extracted -type f -iname '*.png' \
            -exec cp -f {} _site/items/ \;

          echo "Extracted PNG count:"
          find _site/items -type f -iname '*.png' | wc -l

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
